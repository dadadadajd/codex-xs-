name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate Codex Skill structure
        run: python .github/scripts/validate_skill.py skills/amazon-parent-asin-audit

      - name: Render synthetic report
        run: >-
          python skills/amazon-parent-asin-audit/scripts/render_report.py
          --input tests/fixtures/input.valid.json
          --evidence tests/fixtures/evidence.conflicting.json
          --output tmp/report.html

      - name: Validate synthetic delivery
        run: >-
          python skills/amazon-parent-asin-audit/scripts/validate_delivery.py
          --input tests/fixtures/input.valid.json
          --evidence tests/fixtures/evidence.conflicting.json
          --report tmp/report.html
